name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: ruff check src tests
      - run: recurspec contract check docs/architecture
      - run: recurspec contract check docs/examples/log-archive
      - name: Evaluate changed measurable modules
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin "${GITHUB_BASE_REF}"
            mapfile -t files < <(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            mapfile -t files < <(git diff --name-only HEAD^ HEAD)
          else
            files=()
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            python -m recurspec modules check .
          else
            args=()
            for file in "${files[@]}"; do
              args+=(--changed-file "${file}")
            done
            python -m recurspec modules check . "${args[@]}"
          fi
      - if: matrix.python-version == '3.13'
        run: python -m build
