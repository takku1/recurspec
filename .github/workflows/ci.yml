name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # Git Bash exists on the Windows runners, so one shell covers the whole matrix and
    # the probe runner (which resolves `bash` on PATH) behaves the same everywhere.
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Development happens on Windows while CI ran only on Linux, so each platform
          # was the other's blind spot - symlink handling, path separators, and bash
          # discovery were never verified anywhere but a maintainer's machine (R-701).
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: ruff check src tests
      - run: recurspec contract check docs/architecture
      - run: recurspec contract check docs/examples/log-archive
      # A project that gates on evidence must run its own gates. These four passed only
      # when someone remembered to invoke them locally, which is how a source-root
      # default that broke every other repository survived unnoticed (R-701).
      - run: recurspec structure check .
      - run: recurspec stack check .
      - run: recurspec reconcile plan .
      - name: Bundled skill installs and matches
        env:
          CLAUDE_SKILLS_DIR: ${{ runner.temp }}/skills
        run: |
          recurspec skills install --target claude
          recurspec skills check --target claude
      - name: Evaluate changed measurable modules
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin "${GITHUB_BASE_REF}"
            mapfile -t files < <(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            mapfile -t files < <(git diff --name-only HEAD^ HEAD)
          else
            files=()
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            python -m recurspec modules check .
          else
            args=()
            for file in "${files[@]}"; do
              args+=(--changed-file "${file}")
            done
            python -m recurspec modules check . "${args[@]}"
          fi
      - if: matrix.python-version == '3.13' && runner.os == 'Linux'
        run: python -m build
