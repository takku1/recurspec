[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recurspec"
version = "0.2.0"
description = "Evidence-gated recursive system design for AI-assisted software engineering."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "specification", "software-design", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["jsonschema>=4.26,<5"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.12"]
runtime = ["anthropic==0.122.0"]
rust = ["tree-sitter>=0.23,<0.27", "tree-sitter-rust>=0.23,<0.25"]

[project.scripts]
recurspec = "recurspec.cli:main"

[project.urls]
Homepage = "https://github.com/takku1/recurspec"
Repository = "https://github.com/takku1/recurspec.git"
Issues = "https://github.com/takku1/recurspec/issues"
Documentation = "https://github.com/takku1/recurspec/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recurspec = ["schemas/*.json", "skill/**/*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
# pytest suites use bare `assert` (S101, stripped by `python -O` in production code,
# which never applies to tests) and spawn `git` as trusted local test fixtures, not
# runtime probe logic, so PATH-resolution hardening (S603/S607) does not apply.
"tests/*" = ["S101", "S603", "S607"]
